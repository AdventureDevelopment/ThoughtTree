<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>ThoughtTree Prototype 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen phone app. Top: breadcrumb/search; middle: outline; bottom: bar ordered by thumb reach, floating capture button at the thumb's corner. Sheets slide up from below. */
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --text:#2a2520;--muted:#6d645a;--line:#e9e1d4;--ink:#fff;--mark:#7a6bb0;--hl:#f7e3a6;
  --bg:#f7f3ec;--card:#fffdf8;--accent:#9a5e28;--acctext:#84511f;--sel:#f3e7d5;--tint:#f6ece0;
  --shadow:0 3px 12px rgba(40,30,20,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --text:#ece5da;--muted:#a89e90;--line:#363029;--ink:#2a160d;--mark:#a99be0;--hl:#5a4a1e;
  --bg:#1c1915;--card:#23201b;--accent:#e3a35f;--acctext:#ecb985;--sel:#3b2e1e;--tint:#2b241c;--shadow:0 3px 12px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --text:#ece5da;--muted:#a89e90;--line:#363029;--ink:#2a160d;--mark:#a99be0;--hl:#5a4a1e;
  --bg:#1c1915;--card:#23201b;--accent:#e3a35f;--acctext:#ecb985;--sel:#3b2e1e;--tint:#2b241c;--shadow:0 3px 12px rgba(0,0,0,.5);color-scheme:dark}

/* Themes per tree and branch (prototype set): Paper, Sage, Dusk */
.t-sage{--bg:#f1f5ee;--card:#fbfdf9;--accent:#4f7a52;--acctext:#3f6642;--sel:#e1ecdc;--tint:#e9f1e5;--ink:#fff}
.t-dusk{--bg:#f0f0f6;--card:#fbfbfe;--accent:#5a5f9e;--acctext:#4a4f8c;--sel:#e3e4f3;--tint:#eaeaf6;--ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-sage{--bg:#161b17;--card:#1d231e;--accent:#93c497;--acctext:#a9d2ac;--sel:#24342a;--tint:#1f2a22;--ink:#10241a}
:root:not([data-theme="light"]) .t-dusk{--bg:#17171f;--card:#1e1e29;--accent:#a9adf0;--acctext:#bdc0f4;--sel:#2a2b45;--tint:#232436;--ink:#16173a}}
:root[data-theme="dark"] .t-sage{--bg:#161b17;--card:#1d231e;--accent:#93c497;--acctext:#a9d2ac;--sel:#24342a;--tint:#1f2a22;--ink:#10241a}
:root[data-theme="dark"] .t-dusk{--bg:#17171f;--card:#1e1e29;--accent:#a9adf0;--acctext:#bdc0f4;--sel:#2a2b45;--tint:#232436;--ink:#16173a}
/* Inbox theme "Deep stone" (D-82): surface, list, tinted rows, selection, accent, accent text, on accent */
.t-inbox{--bg:#e6e3df;--card:#f4f2ef;--tint:#dcd9d5;--sel:#d3cfca;--accent:#4a4540;--acctext:#3d3934;--ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-inbox{--bg:#1d1b19;--card:#24221f;--tint:#2e2b28;--sel:#39352f;--accent:#cfc7bd;--acctext:#ddd6cd;--ink:#1d1b19}}
:root[data-theme="dark"] .t-inbox{--bg:#1d1b19;--card:#24221f;--tint:#2e2b28;--sel:#39352f;--accent:#cfc7bd;--acctext:#ddd6cd;--ink:#1d1b19}
.t-paper{--bg:#f7f3ec;--card:#fffdf8;--accent:#9a5e28;--acctext:#84511f;--sel:#f3e7d5;--tint:#f6ece0;--ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-paper{--bg:#1c1915;--card:#23201b;--accent:#e3a35f;--acctext:#ecb985;--sel:#3b2e1e;--tint:#2b241c;--ink:#2a160d}}
:root[data-theme="dark"] .t-paper{--bg:#1c1915;--card:#23201b;--accent:#e3a35f;--acctext:#ecb985;--sel:#3b2e1e;--tint:#2b241c;--ink:#2a160d}

html,body{height:100%}
body{background:var(--bg);color:var(--text);font:1rem/1.4 var(--font);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{position:relative;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);overflow:hidden}
.top{display:flex;align-items:center;gap:8px;min-height:48px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.upbtn{width:40px;height:36px;flex:0 0 40px;font-size:1.25rem;font-weight:700;line-height:1;border-radius:8px;color:var(--acctext);background:var(--sel);display:flex;align-items:center;justify-content:center;padding:0 0 2px}
.focushead{flex:1;min-width:0;display:flex;flex-direction:column}
.focushead .crumbs{font-size:0.75rem}
.focushead .editin.focusedit{font-size:1.125rem;line-height:1.3}
.focushead .crumbs button{padding:2px 3px}
.focustitle{margin:0;font-size:1.125rem;line-height:1.3;font-weight:400;cursor:text;text-wrap:balance;overflow-wrap:anywhere}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;white-space:nowrap;font-size:0.875rem;color:var(--muted);scrollbar-width:none}
.crumbs button{padding:6px 4px;border-radius:6px}
.crumbs button:last-child{color:var(--text);font-weight:600}
.crumbs .sep{opacity:.6}
.proto{font-size:0.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:2px 7px;white-space:nowrap}
.searchwrap{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.searchbox{flex:1;display:flex;align-items:center;gap:6px}
.searchfilters{display:flex;gap:8px;flex-wrap:wrap}
.searchfilters .chipbtn{font-size:.875rem;padding:6px 12px;min-height:34px;color:var(--text);border-color:var(--muted)}
.searchfilters .chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:transparent}
.searchbox input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.chipbtn{font-size:0.8125rem;padding:5px 10px;border-radius:14px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chipbtn[aria-pressed="true"]{background:var(--sel);color:var(--acctext);border-color:transparent}

#outline{position:relative;flex:1;overflow-y:auto;background:var(--card);padding-bottom:150px}
.row{display:flex;align-items:flex-start;gap:4px;min-height:44px;border-bottom:1px solid var(--line);padding-block:6px;padding-right:max(8px,env(safe-area-inset-right,0px));padding-left:calc(max(8px,env(safe-area-inset-left,0px)) + var(--depth,0) * 22px);background:var(--card);position:relative}
.row.tinted{background:var(--tint)}
/* filtered views: rows shown only as context for a match are faded; changed items carry when and where (D-103) */
.row.ctx .body,.row.ctx .tw{opacity:.5}
.when{display:inline-block;font-size:.75rem;color:var(--muted);margin-inline-start:6px;white-space:nowrap}
/* D-92: the item that carries the theme gets the full tint, the items inside its branch a lighter shade */
.row.tinted.inner{background:color-mix(in srgb,var(--tint) 45%,var(--card))}
.row[data-id]{touch-action:pan-y}
.row.swiping{transition:none}
.row.snap{transition:transform .18s ease-out}
.swipehint{position:absolute;top:0;bottom:0;right:0;display:flex;align-items:center;padding:0 16px;color:var(--acctext);font-weight:600;font-size:0.875rem;pointer-events:none}
.row.sel{background:var(--sel)}
.row.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px var(--accent)}100%{box-shadow:inset 0 0 0 0 transparent}}
.tw{width:36px;height:34px;flex:0 0 36px;color:var(--muted);font-size:0.75rem;display:flex;align-items:center;justify-content:center;border-radius:8px}
.tw.has{color:var(--acctext);font-size:1.25rem;font-weight:700}
.tw.has.closed{background:var(--sel)}
.tw.leaf{font-size:0.8125rem;color:var(--muted)}
.kids{font-size:0.75rem;color:var(--acctext);background:var(--sel);border-radius:9px;padding:0 7px;margin-inline-start:6px;font-variant-numeric:tabular-nums;vertical-align:1px}
.body{flex:1;min-width:0;padding-top:5px;cursor:default}
.title{word-wrap:break-word}
.title.empty{color:var(--muted);font-style:italic}
.preview{font-size:0.8125rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tag{display:inline-block;font-size:0.75rem;line-height:1.5;border-radius:9px;padding:0 7px;margin-inline-start:6px;background:var(--sel);color:var(--acctext);vertical-align:1px}
.row.sel .tag{background:var(--card)}
button.tag{font-family:inherit;cursor:pointer;min-height:24px;padding:2px 9px;line-height:1.3}
.filterbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:var(--sel);color:var(--acctext);font-size:0.875rem;border-bottom:1px solid var(--line)}
.filterbar span{flex:1;min-width:0}
.placebar{margin-top:6px}
.placebar .chipbtn{color:var(--acctext);border-color:var(--accent);background:var(--card);max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* only the line being edited gets extra space on the capture button's side (D-54) */
.hand-right .row.editing{padding-right:calc(84px + env(safe-area-inset-right,0px))}
.hand-left .row.editing .body{padding-left:62px}
/* D-109: suggestions where the user types: ghost text after the caret, a short list directly under the line */
.body,.focushead,.capline{position:relative}
.sghost{position:absolute;z-index:3;display:flex;align-items:center;min-height:24px;padding:0;font:inherit;color:var(--muted);opacity:.75;white-space:nowrap;overflow:hidden;cursor:pointer;background:none}
.sugglist{display:flex;flex-direction:column;gap:2px;background:var(--card);border-bottom:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) 6px calc(max(8px,env(safe-area-inset-left,0px)) + var(--depth,0) * 22px + 40px)}
.capline + .sugglist,.focushead .sugglist{padding-left:8px;margin:0 -6px;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.focushead .sugglist{position:absolute;left:0;right:0;top:100%;z-index:20}
.sugopt{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;text-align:start;padding:6px 10px;border-radius:8px}
.sugopt:hover,.sugopt:focus-visible{background:var(--sel)}
.sugopt .sub{margin-inline-start:auto;font-size:.75rem;color:var(--muted);white-space:nowrap}
.sugopt .typed{font-weight:700}
.suglbl{font-size:0.75rem;color:var(--muted);padding:2px 10px}
/* templates (D-110): a faded, display-only group row with a stamp icon; template items carry the stamp instead of the dot */
.stampic{display:inline-flex;width:18px;height:18px;flex:0 0 18px}
.stampic svg{width:18px;height:18px}
.tplrow{width:100%;text-align:start;align-items:center;color:var(--muted);font-size:.875rem;min-height:44px}
.tplrow>*{opacity:.8}
.tplrow .tw{color:var(--muted)}
.tplrow .chev{margin-inline-start:4px;font-size:.75rem}
.tw.stamp{gap:1px;color:var(--muted);font-weight:400}
.tw.stamp .caret{font-size:.75rem;color:var(--acctext)}
.slotmark{display:inline-block;font-size:.75rem;color:var(--muted);margin-inline-start:6px;border:1px dashed var(--line);border-radius:8px;padding:0 6px;vertical-align:1px}
/* link slots in created items (D-107): linked items as small accent links, "＋ Link…" to add one */
.slotbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px}
.rlink{min-height:32px;padding:4px 8px;border-radius:8px;font-size:.8125rem;color:var(--acctext);background:color-mix(in srgb,var(--accent) 10%,transparent);text-align:start}
.linkbtn{min-height:32px;padding:4px 10px;border-radius:14px;border:1px dashed var(--accent);font-size:.8125rem;color:var(--acctext)}
.relgroup{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.relgroup .relname{color:var(--muted);font-size:.875rem;margin-inline-end:2px}
.relgroup .rlink{font-size:.9375rem;min-height:40px;padding:6px 10px}
.tplnote{font-size:.8125rem;color:var(--muted);display:flex;align-items:center;gap:6px}
#bar,#b-add{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.browse{display:flex;align-items:center;gap:2px}
.browse .opt{flex:1;min-width:0}
.treerow{display:flex;align-items:center;gap:8px}
.treerow .opt{flex:1;min-width:0}
.btn.small{padding:6px 10px;font-size:0.8125rem}
.more{width:40px;height:32px;flex:0 0 40px;border-radius:8px;color:var(--acctext);font-size:1.25rem;line-height:1}
mark{background:var(--hl);color:inherit;border-radius:3px}
.inboxrow .title{font-weight:600}
.count{font-size:0.8125rem;color:var(--muted);margin-inline-start:6px;font-variant-numeric:tabular-nums}
.editin{width:100%;font:inherit;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--accent);padding:2px 0;outline:none}
.emptystate{padding:28px 20px;color:var(--muted);text-align:center}

/* bottom bar ordered by reach for the right thumb: More (far) … Add here (nearest) */
#bar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#bar button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;color:var(--muted);font-size:1.25rem}
#bar button small{font-size:0.6875rem}
.hand-left #bar{direction:rtl}
.hand-left #bar button{direction:ltr}
#fab{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + var(--kb,0px) + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:1.5rem;box-shadow:var(--shadow);z-index:48}
.hand-left #fab{right:auto;left:calc(16px + env(safe-area-inset-left,0px))}
#backpill{position:absolute;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:15;pointer-events:none}
#backpill button{pointer-events:auto;background:var(--text);color:var(--bg);font-size:0.8125rem;border-radius:16px;padding:7px 14px;box-shadow:var(--shadow);max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* editing toolbar above the keyboard */
.captools{display:flex;align-items:center;gap:2px;background:var(--bg);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) 4px max(6px,env(safe-area-inset-left,0px));overflow-x:auto}
.captools button{min-width:40px;height:40px;border-radius:8px;font-size:1rem;color:var(--text)}
.captools button[disabled]{opacity:.35}
.captools .done{margin-inline-start:auto;background:var(--accent);color:var(--ink);font-weight:700;font-size:1.125rem}
.hand-left .captools{direction:rtl}.hand-left .captools button{direction:ltr}
#tools{position:absolute;left:0;right:0;bottom:var(--kb,0px);display:flex;align-items:center;gap:2px;background:var(--bg);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) 4px max(6px,env(safe-area-inset-left,0px));z-index:30;overflow-x:auto}
#tools button{min-width:40px;height:40px;border-radius:8px;font-size:1rem;color:var(--text)}
#tools .done{margin-inline-start:auto;background:var(--accent);color:var(--ink);font-weight:700;font-size:1.125rem}
.hand-left #tools{direction:rtl}.hand-left #tools button{direction:ltr}

/* toast */
#toast{position:absolute;left:12px;right:12px;bottom:calc(144px + var(--kb,0px) + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);z-index:70;font-size:0.875rem}
#toast.attop{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px))}
#toast span{flex:1;min-width:0}
#toast button{color:var(--bg);font-weight:600;padding:4px 6px;text-decoration:underline}

/* sheets and popovers */
#scrim{position:absolute;inset:0;background:rgba(20,15,10,.35);z-index:50}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);max-height:86%;display:flex;flex-direction:column;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:var(--shadow);z-index:60;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheethead{display:flex;align-items:center;gap:8px;padding:12px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheethead h2{flex:1;margin:0;font-size:1rem;text-wrap:balance}
.sheethead .sub{display:block;font-size:0.75rem;font-weight:400;color:var(--muted)}
.sheetbody{overflow-y:auto;padding:8px max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px))}
.btn{padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--acctext);border:1px solid var(--line)}
.btn.danger{background:#a33b2b;color:#fff}
.lbl{font-size:0.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 6px;border-bottom:1px solid var(--line);min-height:44px}
.opt .path{display:block;font-size:0.75rem;color:var(--muted)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt .cnt{margin-inline-start:auto;font-size:0.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.field{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.capline{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.capline.old{color:var(--muted);font-size:0.875rem}
.capline input{flex:1;min-width:0;font:inherit;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--accent);padding:4px 0;outline:none}
.hint{font-size:0.8125rem;color:var(--muted);margin:10px 0 0;max-width:62ch}
.pop{position:absolute;z-index:60;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px;max-height:70%;overflow-y:auto}
.pop button{display:block;width:100%;text-align:start;padding:11px 14px;border-radius:8px;min-height:44px}
.pop button:hover{background:var(--sel)}
.pop button[disabled]{opacity:.45;cursor:not-allowed;background:none}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.pop .del{color:#b0412f}
.ev{padding:9px 0;border-bottom:1px solid var(--line);font-size:0.875rem}
.ev .meta{font-size:0.75rem;color:var(--muted)}
.ev.rev .what{text-decoration:line-through;opacity:.7}
.ev code{font-size:0.75rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.75rem}

/* detail page */
#detail{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;background:var(--bg)}
#detail .dhead{display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
#detail .dhead button{width:40px;height:36px;flex:0 0 40px;font-size:1.25rem;font-weight:700;line-height:1;border-radius:8px;color:var(--acctext);background:var(--sel);display:flex;align-items:center;justify-content:center;padding:0 0 2px}
#detail .dhead .dpath{line-height:36px}
.mdview{flex:1;min-height:40vh;font:1rem/1.55 var(--font);cursor:text;overflow-wrap:anywhere}
.mdview p{margin:0 0 .7em}
.mdview h3,.mdview h4,.mdview h5{margin:.6em 0 .3em;line-height:1.3}
.mdview h3{font-size:1.1875rem}.mdview h4{font-size:1.0625rem}.mdview h5{font-size:1rem}
.mdview ul,.mdview ol{margin:0 0 .7em;padding-inline-start:1.4em}
.mdview code,.title code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--sel);border-radius:4px;padding:0 4px}
.mdview a,.title a{color:var(--acctext)}
.mdview .ph{color:var(--muted);font-style:italic}

</style>

<div id="app" class="t-paper hand-right">
  <header class="top" id="top"></header>
  <main id="outline" aria-label="Outline"></main>
  <div id="backpill" hidden><button id="backbtn"></button></div>
  <button id="fab" aria-label="Capture a thought into the inbox">📥</button>
  <nav id="bar" aria-label="Main actions">
    <button id="b-more" aria-label="More"><span>⋯</span><small>More</small></button>
    <button id="b-undo" aria-label="Undo"><span>↩</span><small>Undo</small></button>
    <button id="b-search" aria-label="Search"><span>🔍</span><small>Search</small></button>
    <button id="b-add" aria-label="Add here" aria-description="Press and hold for From template…" title="Tap: add here · hold: From template…"><span>＋</span><small>Add here</small></button>
  </nav>
  <div id="tools" hidden role="toolbar" aria-label="Editing">
    <button data-t="undo" aria-label="Undo typing">↩</button>
    <button data-t="redo" aria-label="Redo typing">↪</button>
    <button data-t="out" aria-label="Outdent">⇤</button>
    <button data-t="in" aria-label="Indent">⇥</button>
    <button data-t="up" aria-label="Move up">↑</button>
    <button data-t="down" aria-label="Move down">↓</button>
    <button data-t="note" aria-label="Insert note separator">##</button>
    <button data-t="tag" aria-label="Insert tag marker">@@</button>
    <button data-t="tpl" aria-label="Create from a template: insert :: at the start of an empty line">::</button>
    <button data-t="link" aria-label="Link to another item: insert [[">🔗</button>
    <button data-t="done" class="done" aria-label="Done">✓</button>
  </div>
  <div id="toast" hidden role="status"></div>
  <div id="scrim" hidden></div>
  <section id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></section>
  <div id="pop" class="pop" hidden role="menu"></div>
  <section id="detail" hidden aria-label="Item details"></section>
  <div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>
</div>

<script>
(()=>{
"use strict";
/* ---------- storage (browser only; prototype) ---------- */
/* v4: templates (ADR-068) and inline item links; v3: several trees (events carry `tree`), every event carries `actionId` (ADR-067) */
const K={ev:"tt-proto-events-v5",dev:"tt-proto-device-v2",ui:"tt-proto-ui-v5"};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uuid=()=>{try{return crypto.randomUUID()}catch(e){return "x"+Math.random().toString(16).slice(2)+Date.now().toString(16)}};
let device=load(K.dev,null);
if(!device){device={id:uuid(),label:/iPad|Tablet/i.test(navigator.userAgent)?"Tablet":/Mobi|iPhone|Android/i.test(navigator.userAgent)?"Phone":"Desktop"};save(K.dev,device)}
let all=load(K.ev,[]);      /* every event of every tree on this device */
let events=[];              /* the events of the open tree */
let curTree=null;
const ui=Object.assign({tree:null,per:{},added:[],focus:null,collapsed:[],hand:"right",recent:[],lastPlaced:null,tplOpen:[]},load(K.ui,{}));
const PER=["focus","collapsed","recent","lastPlaced","tplOpen"];
const saveUi=()=>{if(curTree){ui.per[curTree]={};for(const k of PER)ui.per[curTree][k]=ui[k]}save(K.ui,{tree:curTree,per:ui.per,hand:ui.hand,added:ui.added||[]})};
const saveEvents=()=>save(K.ev,all);

/* ---------- events, hybrid logical clock ---------- */
let INBOX=null; /* the inbox is an ordinary item, marked by tree.inbox-set; always shown last at top level */
const isoLocal=d=>{const o=-d.getTimezoneOffset(),s=o>=0?"+":"-",p=n=>String(Math.floor(Math.abs(n))).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())+s+p(o/60)+":"+p(o%60)};
function nextClock(){let mt=0,mc=0;for(const e of all){if(e.clock.t>mt||(e.clock.t===mt&&e.clock.c>mc)){mt=e.clock.t;mc=e.clock.c}}
  const now=Date.now();return now>mt?{t:now,c:0}:{t:mt,c:mc+1}}
const order=(a,b)=>a.clock.t-b.clock.t||a.clock.c-b.clock.c||(a.device<b.device?-1:a.device>b.device?1:0);
/* one user action = one actionId shared by all events written inside action(fn) (ADR-067) */
let curAction=null;
function action(fn){if(curAction)return fn();curAction=uuid();try{return fn()}finally{curAction=null}}
function write(type,data){const e={id:uuid(),type,schema:1,tree:curTree,actionId:curAction||uuid(),device:device.id,deviceLabel:device.label,clock:nextClock(),timestamp:isoLocal(new Date()),data};
  events.push(e);all.push(e);saveEvents();return e}

/* ---------- projection ---------- */
let P=null;
function project(evs){
  let inbox=null,name=null,tutorial=false;const items=new Map(),kids=new Map([["",[]]]),tags=new Map(),tagOf=new Map(),themes=new Map(),reverted=new Map();
  const list=k=>{if(!kids.has(k))kids.set(k,[]);return kids.get(k)};
  const pk=p=>p==null?"":p;
  const detach=it=>{const l=list(pk(it.parent));const i=l.indexOf(it.id);if(i>=0)l.splice(i,1)};
  const place=(it,parent,after)=>{const l=list(pk(parent));let i=after?l.indexOf(after):-1;l.splice(i+1,0,it.id);it.parent=parent};
  const isDesc=(id,anc)=>{let p=items.get(id);while(p){if(p.parent===anc)return true;p=items.get(p.parent)}return false};
  for(const e of [...evs].sort(order)){
    const d=e.data||{};if(d.reverts)reverted.set(d.reverts,e);
    /* events copied in from an imported tree keep their history, but not their tree-level settings (D-84) */
    if(e.fromTree&&(e.type==="tree.inbox-set"||e.type==="tree.named"||(e.type==="theme.set"&&d.target==="tree")))continue;
    const it=items.get(d.itemId);
    switch(e.type){
      case"tree.named":name=d.name;tutorial=!!d.tutorial;break;
      case"item.created":if(items.has(d.itemId))break;{const n={id:d.itemId,parent:null,title:d.title||"",note:d.note||"",deleted:false,tags:new Set(),created:e.clock.t,changed:e.clock.t,template:false,fromTemplate:d.fromTemplate||null};items.set(n.id,n);place(n,d.parentId??null,d.afterItemId)}break;
      case"item.title-changed":if(it){it.title=d.title;it.changed=e.clock.t}break;
      case"item.note-changed":if(it){it.note=d.note;it.changed=e.clock.t}break;
      case"tree.inbox-set":inbox=d.itemId;break;
      case"item.moved":if(it&&it.id!==inbox){let par=d.parentId??null;if(par&&par!==INBOX&&(par===it.id||isDesc(par,it.id)))par=null;detach(it);place(it,par,d.afterItemId);it.changed=e.clock.t}break;
      case"item.deleted":if(it&&it.id!==inbox){it.deleted=true;it.changed=e.clock.t}break;
      case"item.restored":if(it){it.deleted=false;it.changed=e.clock.t}break;
      case"tag.defined":if(!tags.has(d.tagId))tags.set(d.tagId,{id:d.tagId,name:""});break;
      case"display-name.set":if(tags.has(d.elementId))tags.get(d.elementId).name=d.text;break;
      case"item.tagged":if(it){it.tags.add(d.tagId);it.changed=e.clock.t}break;
      case"item.untagged":if(it){it.tags.delete(d.tagId);it.changed=e.clock.t}break;
      case"theme.set":themes.set(d.target,d.themeId);if(it)it.changed=e.clock.t;break;
      /* ADR-068: a template is an ordinary item marked by events */
      case"item.template-set":if(it){it.template=true;it.changed=e.clock.t}break;
      case"item.template-removed":if(it){it.template=false;it.changed=e.clock.t}break;
    }
  }
  for(const [id,t] of themes){const i=items.get(id);if(i)i.theme=t||null}
  return {items,kids,tags,themes,reverted,inbox,name,tutorial,treeTheme:themes.get("tree")||"paper",list,pk};
}
const refresh=()=>{P=project(events);INBOX=P.inbox};
/* ---------- trees on this device (D-69): events are tagged with their tree ---------- */
const treeIds=()=>{const s=[];for(const e of all)if(e.tree&&!s.includes(e.tree))s.push(e.tree);return s};
const treeInfo=tid=>{const p=project(all.filter(e=>e.tree===tid));return{name:p.name||"Untitled tree",tutorial:p.tutorial}};
const treeName=tid=>tid===curTree?(P.name||"Untitled tree"):treeInfo(tid).name;
function setTree(tid){if(curTree)saveUi();curTree=tid;events=all.filter(e=>e.tree===tid);
  const s=ui.per[tid]||{};ui.focus=s.focus||null;ui.collapsed=s.collapsed||[];ui.recent=s.recent||[];ui.lastPlaced=s.lastPlaced||null;ui.tplOpen=s.tplOpen||[];refresh();saveUi()}
function newTree(name,extra){const tid=uuid();const prev=curTree,prevEvents=events;curTree=tid;events=[];
  action(()=>{write("tree.named",Object.assign({treeId:tid,name},extra||{}));const ib=uuid();
    write("item.created",{itemId:ib,parentId:null,afterItemId:null,title:"📥 Inbox",note:"",format:"markdown"});write("tree.inbox-set",{itemId:ib});write("theme.set",{target:ib,themeId:"inbox"});
    const pid=seedPredefined();ui.per[tid]=Object.assign({focus:null,recent:[],lastPlaced:null,tplOpen:[]},ui.per[tid]||{},{collapsed:[pid]})});
  curTree=prev;events=prevEvents;return tid}
/* D-107, ADR-068: the predefined "Person" template, written as ordinary events when a tree is created, at the top level; its lines are plain text */
function seedPredefined(){const p=uuid();
  write("item.created",{itemId:p,parentId:null,afterItemId:null,title:"👤 Person",note:"",format:"markdown"});
  write("item.template-set",{itemId:p});
  /* D-112: a template carries tags that every item made from it inherits; "person" finds all persons */
  const tg=uuid();write("tag.defined",{tagId:tg});write("display-name.set",{elementId:tg,field:"name",language:"en",text:"person"});write("item.tagged",{itemId:p,tagId:tg});
  let prev=null;for(const title of["🤝 How we met: ","🎂 Birthday: ","👪 Family: ","✨ Shared interests: ","🏘 Shared communities: "]){const id=uuid();write("item.created",{itemId:id,parentId:p,afterItemId:prev,title,note:"",format:"markdown"});prev=id}
  return p}
/* templates are left out of the children; they are shown in the branch's "Templates" row (D-110) */
const kidsOf=id=>{const k=(P.kids.get(id==null?"":id)||[]).filter(k=>{const i=P.items.get(k);return i&&!i.deleted&&!i.template});if(id==null&&INBOX&&k.includes(INBOX)){k.splice(k.indexOf(INBOX),1);k.push(INBOX)}return k};
const tplsOf=id=>(P.kids.get(id==null?"":id)||[]).filter(k=>{const i=P.items.get(k);return i&&!i.deleted&&i.template});
const inTpl=id=>{let i=P.items.get(id);while(i){if(i.template)return true;i=P.items.get(i.parent)}return false};
const visibleItem=id=>{let i=P.items.get(id);while(i){if(i.deleted)return false;if(i.parent==null||i.parent===INBOX)return true;i=P.items.get(i.parent)}return false};
function pathOf(id){const out=[];let i=P.items.get(id);while(i){out.unshift(i);i=P.items.get(i.parent)}return out}
const pathText=id=>[treeName(curTree),...pathOf(id).slice(0,-1).map(x=>x.title||"Untitled")].join(" › ");
/* state.preview = {target, theme}: the theme picker's live preview, applied wherever the page shows that target (D-65) */
const treeTheme=()=>state.preview&&state.preview.target==="tree"?(state.preview.theme||"paper"):P.treeTheme;
const themeFor=id=>{let i=P.items.get(id);while(i){if(state.preview&&state.preview.target===i.id){if(state.preview.theme)return state.preview.theme}else if(i.theme)return i.theme;i=P.items.get(i.parent)}return treeTheme()};
const tagName=t=>(P.tags.get(t)||{}).name||"tag";

/* ---------- seed (example data, marked) ---------- */
/* the tutorial is its own tree (D-69); its content consists of thoughts, not tasks (D-67) */
function seedTutorial(){
  const tid=uuid();const prev=curTree,prevEvents=events;curTree=tid;events=[];const start=all.length;
  const ids={};const mk=(key,parent,after,title,note)=>{ids[key]=uuid();write("item.created",{itemId:ids[key],parentId:parent==null?null:ids[parent],afterItemId:after?ids[after]:null,title,note:note||"",format:"markdown"})};
  write("tree.named",{treeId:tid,name:"Tutorial",tutorial:true});
  mk("inbox",null,null,"📥 Inbox","Captured thoughts wait here until you sort them. It always stays last at the top level.");write("tree.inbox-set",{itemId:ids.inbox});write("theme.set",{target:ids.inbox,themeId:"inbox"});
  mk("w",null,null,"👋 Welcome to ThoughtTree","This tree explains itself. Work through it from top to bottom and try everything. Your own thoughts live in the tree “My thoughts”: More › Trees switches to it. You can delete this tutorial whenever you like.");
  mk("w1","w",null,"Tap a line once to select it, tap again to edit it");
  mk("w2","w","w1","Swipe left on a line to open its note","You found a note. Notes can be **bold** or *italic*, have headings and lists:\n- like this one\n- and links, for example [back to the start](item:WELCOME)\n\nTap the note to write in it.");
  mk("w3","w","w2","The arrow ▸ means there is more inside");
  mk("w3a","w3",null,"Hidden until you open the arrow");
  mk("w3b","w3","w3a","Tap the arrow again to close it");
  mk("w4","w","w3","⋯ on a selected line opens its actions");
  mk("c",null,"w","📥 Capture and sort");
  mk("c1","c",null,"Tap 📥 to capture a thought, wherever you are, even while writing");
  mk("c2","c","c1","Captured thoughts wait in the Inbox at the bottom, without pressure");
  mk("c3","c","c2","Sort them when it suits you: ⋯ › Move to… finds a place and a position");
  mk("c3a","c","c3","After one move, the next thought can go right below it with one tap");
  mk("c4","c","c3a","↩ Undo takes back your last step, even a move");
  mk("f",null,"c","✍️ Writing faster");
  mk("f1","f",null,"Enter starts the next line");
  mk("f2","f","f1","A space at the start of an empty line nests it under the line above");
  mk("f3","f","f2","Backspace on an empty line moves it back out");
  mk("f4","f","f3","Type “Title ## note” to add a note in one go");
  mk("f5","f","f4","Type @@ and a name to add a tag; known tags are suggested");
  mk("t",null,"f","🎨 Every branch can have its own mood");
  mk("t1","t",null,"This branch uses the Sage theme");
  mk("t2","t","t1","⋯ › Theme changes it, with a live preview");
  mk("t3","t","t2","⋯ › Focus shows only this branch, in its theme");
  mk("s",null,"t","🔎 Finding things again");
  mk("s1","s",null,"🔍 Search filters the tree while you type");
  mk("s2","s","s1","Tap a tag to see everything with it");
  mk("s3","s","s2","“Changed recently” shows what is new");
  mk("l",null,"s","🔗 Linking thoughts");
  mk("l1","l",null,"Type [[ to link to another thought while writing","A few letters are enough: the best match appears as faded text after the cursor (tap it, or press Tab), and a short list opens under the line. “Create …” makes a new thought in the inbox and links it at once. The 🔗 button above the keyboard does the same.");
  mk("l2","l","l1","A link shows the other thought's current title, even after renaming");
  mk("p",null,"l","🧩 Templates");
  mk("p1","p",null,"Type :: at the start of a line to create from a template","For example `::person Anna` creates “👤 Anna” with the lines of the Person template. A branch's templates wait in its faded “Templates” row at the end; the tree's own templates sit just above the inbox.");
  mk("p2","p","p1","Press and hold ＋ for From template…");
  mk("p3","p","p2","Any item can become a template: ⋯ › Use as template");
  mk("l3","l","l2","Tap a link to go there, like this one: [](item:"+ids.p+")");
  mk("l4","l","l3","On the detail page, ↩ shows which thoughts link here, 🔗 where this one links to");
  mk("d",null,"p","🔁 More than one device");
  mk("d1","d",null,"More › Exchange with another device copies all changes over");
  mk("d2","d","d1","Every change is kept: ⋯ › History lists them, and each can be reverted");
  mk("in1","inbox",null,"Sort me into “Capture and sort” with ⋯ › Move to…");
  mk("in2","inbox","in1","Why do ideas come more easily while walking?");
  mk("in3","inbox","in2","Perhaps a quiet mind notices more than a busy one");
  const t1=uuid();write("tag.defined",{tagId:t1});write("display-name.set",{elementId:t1,field:"name",language:"en",text:"tip"});
  for(const k of ["w2","f4","f5","c4","s2"])write("item.tagged",{itemId:ids[k],tagId:t1});
  write("theme.set",{target:ids.t,themeId:"sage"});
  const person=seedPredefined();
  /* mark seed events as tutorial data */
  for(const e of all.slice(start)){if(e.data&&typeof e.data.note==="string")e.data.note=e.data.note.replace("item:WELCOME","item:"+ids.w);e.device="tutorial";e.deviceLabel="Tutorial";e.actionId="tutorial-"+tid}
  saveEvents();ui.per[tid]={focus:null,collapsed:[ids.w3,person],recent:[],lastPlaced:null,tplOpen:[]};
  curTree=prev;events=prevEvents;return tid}
/* first start: the tutorial (opened first) next to the user's own tree "My thoughts", empty except its inbox */
function fresh(){all=[];saveEvents();ui.per={};curTree=null;const tut=seedTutorial();newTree("My thoughts");setTree(tut)}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=$("#app"),outline=$("#outline"),top=$("#top"),sheet=$("#sheet"),scrim=$("#scrim"),pop=$("#pop"),toastEl=$("#toast"),tools=$("#tools"),detail=$("#detail");
const el=(tag,props,...children)=>{const n=document.createElement(tag);if(props)for(const[k,v]of Object.entries(props)){if(k==="class")n.className=v;else if(k==="text")n.textContent=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?"":v)}for(const c of children){if(c!=null)n.append(c)}return n};
const announce=t=>{$("#live").textContent=t};
/* a simple rubber stamp, thin strokes in the current colour */
const STAMP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.6 9.2a3.4 3.4 0 1 1 4.8 0"/><path d="M10 9.2l-.6 3.8h5.2L14 9.2"/><path d="M5 15.2c0-1.2 1-2.2 2.2-2.2h9.6c1.2 0 2.2 1 2.2 2.2V17H5z"/><path d="M4 20.5h16"/></svg>';
const stampIcon=()=>{const s=document.createElement("span");s.className="stampic";s.innerHTML=STAMP;return s};
const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u").replace(/ß/g,"ss");
const normText=s=>(s||"").normalize("NFC");
const ZW="\u200B";const clean=v=>(v||"").replace(/\u200B/g,""); /* invisible marker in empty lines, so Backspace on an empty line is noticed on every phone keyboard */
let state={nav:[],sel:null,draft:null,search:null,recentOnly:false,preview:null,filter:null,resume:null};
if(!all.length||!all.some(e=>e.tree))fresh();else setTree(treeIds().includes(ui.tree)?ui.tree:treeIds()[0]);

/* ---------- write helpers ---------- */
function lastChild(parent){const k=kidsOf(parent).filter(x=>x!==INBOX);return k.length?k[k.length-1]:null}
function ensureTag(name){const n=norm(name);for(const t of P.tags.values())if(norm(t.name)===n)return t.id;
  const id=uuid();write("tag.defined",{tagId:id});write("display-name.set",{elementId:id,field:"name",language:"en",text:name});refresh();return id}
function parseTitle(raw){let title=normText(clean(raw)).replace(/\r?\n/g," ");let note=null;const tagsFound=[];
  const m=title.match(/^(.*?)(?<!\\)##(.*)$/s);if(m){title=m[1];note=m[2].trim()}title=title.replace(/\\##/g,"##");
  title=title.replace(/@@([\p{L}\p{N}_-]+)/gu,(_,t)=>{tagsFound.push(t);return""}).replace(/\s{2,}/g," ").trim();
  return {title,note,tags:tagsFound}}
/* `Title ## note @@tag` is one action: create or retitle, note, tags share one actionId (ADR-067) */
function applyParsed(id,parsed,isNew,parent,after){action(()=>{

/* safe Markdown rendering: DOM nodes only, never HTML; links only https, http, mailto, item */
function mdInline(text){const frag=document.createDocumentFragment();const re=/(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*\s][^*]*\*|_[^_\s][^_]*_)|(\[[^\]]*\]\([^)\s]*\))/g;let last=0,m;

    if(m[1])frag.append(el("code",{text:s.slice(1,-1)}));
    else if(m[2])frag.append(el("strong",null,mdInline(s.slice(2,-2))));
    else if(m[3])frag.append(el("em",null,mdInline(s.slice(1,-1))));
    else{const lm=s.match(/^\[([^\]]*)\]\(([^)\s]*)\)$/);const label=lm[1],href=lm[2];
      if(/^item:/i.test(href)){const tid=href.slice(5);const t=P.items.get(tid);frag.append(el("a",{href:"#",class:"ilink",text:label||itemLabel(tid),"aria-label":"Go to "+(label||itemLabel(tid)),onclick:ev=>{ev.preventDefault();ev.stopPropagation();if(t&&!t.deleted){commitDraft(false,true);if(!detail.hidden)closeDetail();goTo(tid)}}}))}
      else if(/^(https?:|mailto:)/i.test(href))frag.append(el("a",{href,target:"_blank",rel:"noopener noreferrer",text:label||href}));

    status.replaceChildren(`${added} new events from ${from} (${shown.size} items new or changed). ${same} already known.`+(rejected?` ${rejected} rejected: same id, different content.`:""));
    /* D-21: Show filters the tree to all arrived or changed items and their ancestors */
    if(added){toast(`${shown.size} new or changed ${shown.size===1?"item":"items"} from ${from}`,[...(shown.size?[["Show",()=>{commitDraft(false,true);ui.focus=null;state.search=null;state.sel=null;state.filter={label:"New or changed from "+from,test:it=>shown.has(it.id)};closeAll();if(!detail.hidden)closeDetail();renderAll()}]]:[]),["Send back",()=>exchangeSheet()]])}
    else toast(`Nothing new from ${from}: both devices already have the same events.`)};
  const doImport=txt=>{let data;try{data=JSON.parse(txt)}catch(e){status.replaceChildren("That is not a ThoughtTree export. Was the whole text pasted?");return}
    if(!data||data.format!=="thoughttree-prototype-export"||!Array.isArray(data.events)){status.replaceChildren("That is not a ThoughtTree export.");return}
    const theirs=data.treeId||("old-"+(treeIdOf(data.events)||uuid()));
    const evs=valid(data.events).map(e=>Object.assign({},e,{tree:theirs,actionId:e.actionId||e.id}));
    const name=data.treeName||project(evs).name||"Tree from "+(data.from||"another device");
    if(treeIds().includes(theirs)){merge(data,evs,theirs);status.scrollIntoView({block:"nearest"});return}
    /* D-84: a different tree is never merged silently and never replaces this device's tree */
    status.replaceChildren(el("p",{style:"margin:0 0 8px;color:var(--text)",text:`“${name}” from ${data.from||"the other device"} is a tree that is not on this device yet.`}),
      el("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},
        el("button",{class:"btn",text:"Add as a further tree",onclick:()=>{all.push(...evs);saveEvents();ui.added=[...new Set([...(ui.added||[]),theirs])];saveUi();
          const target=home!==theirs&&!treeInfo(home).tutorial?home:treeIds().find(t=>t!==theirs&&!treeInfo(t).tutorial);
          status.replaceChildren(el("p",{style:"margin:0 0 8px;color:var(--text)",text:`Added “${name}” as a further tree on this device.`}),
            el("div",{style:"display:flex;flex-direction:column;gap:8px"},
              el("button",{class:"btn ghost",text:`Open “${name}”`,onclick:()=>switchTree(theirs)}),
              target?el("button",{class:"btn ghost",text:`Import “${name}” into “${treeName(target)}” as a new branch`,onclick:()=>importAsBranch(theirs,target)}):null,
              el("span",{class:"hint",style:"margin:0",text:`You can import it later too: open “${name}”, then More.`})));
          renderAll()}}),
        el("button",{class:"btn ghost",text:"Cancel",onclick:()=>{status.replaceChildren("Nothing was changed.")}})));
    status.scrollIntoView({block:"nearest"})};
  file.addEventListener("change",()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f)});
  const exportBtn=el("button",{class:"btn",text:"Copy the events of “"+treeName(curTree)+"”",onclick:async()=>{const t=exportText();try{await navigator.clipboard.writeText(t);status.textContent=`Copied ${events.length} events. Paste them on the other device, for example through a note or a message to yourself.`}catch(e){area.value=t;area.focus();area.select();status.textContent="Copying was refused here. The text is selected below: copy it by hand."}}});
  openSheet("Exchange with another device","Both devices end up with all events of “"+treeName(curTree)+"”",[
    el("div",{class:"lbl",text:"1 · Send"}),exportBtn,
    el("div",{class:"lbl",text:"2 · Receive"}),area,el("div",{style:"display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"},el("button",{class:"btn ghost",text:"Import pasted text",onclick:()=>doImport(area.value)}),file),
    status,el("p",{class:"hint",text:"Events with an id you already have are skipped. Afterwards, send your own events back so both devices are equal. In the real app this is an encrypted file; here it is plain text, so do not use private notes."})])}
function logSheet(){const list=[...events].sort(order).reverse().slice(0,200);
  const reset=el("button",{class:"btn danger",text:"Reset prototype…",onclick:()=>{reset.replaceWith(el("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap"},el("span",{class:"hint",text:"Delete all events in this browser?"}),
    el("button",{class:"btn danger",text:"Delete everything",onclick:resetAll})))}});
  openSheet("Event log",events.length+" events in “"+treeName(curTree)+"”, newest first",[...list.map(e=>el("div",{class:"ev"+(P.reverted.has(e.id)?" rev":"")},el("div",null,el("code",{text:e.type}),el("span",{class:"what",text:"  "+describe(e)})),el("div",{class:"meta",text:when(e)+" · "+who(e)+" · clock "+e.clock.t+"."+e.clock.c+" · action "+String(e.actionId).slice(0,8)+(e.fromTree?" · imported":"")}))),el("div",{style:"margin-top:14px"},reset)])}
function aboutSheet(){const p=t=>el("p",{class:"hint",text:t});
  openSheet("About this prototype","A clickable sketch, not the app",[
    p("You start in the tutorial, a tree of its own; your own thoughts go into the tree “My thoughts” (More › Trees). This page lets you try the UX decisions of ThoughtTree on your phone: capturing into the inbox, sorting with Move to…, the item menu, Focus, the detail page, tags with @@, notes with ##, themes per branch and per tree, quick undo and the history."),
    p("Every change is written as an event (item.created, item.moved, theme.set, …) with a hybrid logical clock and an action id; events written for one action are undone together. The outline is computed from the event log, as in the architecture. The log lives only in this browser; clearing site data deletes it."),
    p("Templates: a template is an ordinary item marked as a template, valid in its parent's branch (at the top level in the whole tree); each tree starts with “👤 Person”. Type ::person Anna on an empty line, or hold ＋ Add here. Type [[ to link another item inside a title; the detail page counts links and “Linked from”."),
    p("Not real: no encryption, no Blazor, no installation as an app, no typed relations or views yet, no drag and drop, no conflict view. The inbox is an ordinary item marked as the inbox, always last at the top level, as in the architecture."),
    p("This device: "+device.label+" · "+device.id.slice(0,8))])}

/* ---------- wiring ---------- */
$("#fab").addEventListener("click",capture);
$("#fab").addEventListener("pointerdown",ev=>{if(state.draft)ev.preventDefault()}); /* keeps the keyboard and the cursor while editing (D-54) */
$("#fab").addEventListener("mousedown",ev=>{if(state.draft)ev.preventDefault()});
/* D-95: an expanded parent gets the new line as its first child; a leaf or a collapsed item gets it directly below; the inbox, which stays last, gets it as its first child;
   below a collapsed template the line goes to the end of the branch's ordinary items */
function addPlace(){const sel=state.sel?P.items.get(state.sel):null;
  if(sel&&sel.id===INBOX)return{parent:INBOX,after:null};
  if(sel&&kidsOf(sel.id).length&&!ui.collapsed.includes(sel.id))return{parent:sel.id,after:null};
  if(sel&&sel.template)return{parent:sel.parent,after:lastChild(sel.parent)};
  if(sel)return{parent:sel.parent,after:sel.id};
  return{parent:ui.focus,after:lastChild(ui.focus)}}
/* D-108: press and hold "＋ Add here" (about half a second) offers "From template…"; a normal tap adds a line */
const addBtn=$("#b-add");let holdTimer=null,held=false;
addBtn.addEventListener("pointerdown",()=>{held=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{held=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}fromTemplateSheet(addPlace())},500)});
for(const t of["pointerup","pointerleave","pointercancel"])addBtn.addEventListener(t,()=>clearTimeout(holdTimer));
addBtn.addEventListener("contextmenu",ev=>ev.preventDefault());
addBtn.addEventListener("click",()=>{if(held){held=false;return}const pl=addPlace();
  if(pl.parent===INBOX)ui.collapsed=ui.collapsed.filter(c=>c!==INBOX);startNew(pl.parent,pl.after)});
$("#b-search").addEventListener("click",()=>{state.search=state.search===null?"":null;state.recentOnly=false;renderAll()});
$("#b-undo").addEventListener("click",()=>{commitDraft(false,true);quickUndo()});
$("#b-more").addEventListener("click",moreSheet);
document.addEventListener("keydown",ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key==="z"&&!ev.target.closest("input,textarea")){ev.preventDefault();quickUndo()}
  if(ev.key==="Escape"&&(!sheet.hidden||!pop.hidden)){closeAll();renderAll()}});
function renderAll(){renderTop();renderOutline()}
applyHand();
if(ui.focus&&ui.focus!==INBOX&&!(P.items.get(ui.focus)&&visibleItem(ui.focus)))ui.focus=null;
renderAll();
})();
</script>
