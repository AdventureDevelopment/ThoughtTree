<style>
/* Layout: one-screen phone app. Top: breadcrumb/search; middle: outline; bottom: bar ordered by thumb reach, floating capture button at the thumb's corner. Sheets slide up from below. */
:root{

  --bg:#1c1915;--card:#23201b;--accent:#e3a35f;--acctext:#ecb985;--sel:#3b2e1e;--tint:#2b241c;--shadow:0 3px 12px rgba(0,0,0,.5);color-scheme:dark}}

.t-dusk{--bg:#f0f0f6;--card:#fbfbfe;--accent:#5a5f9e;--acctext:#4a4f8c;--sel:#e3e4f3;--tint:#eaeaf6;--ink:#fff}

:root:not([data-theme="light"]) .t-dusk{--bg:#17171f;--card:#1e1e29;--accent:#a9adf0;--acctext:#bdc0f4;--sel:#2a2b45;--tint:#232436;--ink:#16173a}}
:root[data-theme="dark"] .t-sage{--bg:#161b17;--card:#1d231e;--accent:#93c497;--acctext:#a9d2ac;--sel:#24342a;--tint:#1f2a22;--ink:#10241a}
:root[data-theme="dark"] .t-dusk{--bg:#17171f;--card:#1e1e29;--accent:#a9adf0;--acctext:#bdc0f4;--sel:#2a2b45;--tint:#232436;--ink:#16173a}

:root[data-theme="dark"] .t-paper{--bg:#1c1915;--card:#23201b;--accent:#e3a35f;--acctext:#ecb985;--sel:#3b2e1e;--tint:#2b241c;--ink:#2a160d}

#tools{position:absolute;left:0;right:0;bottom:var(--kb,0px);display:flex;align-items:center;gap:2px;background:var(--bg);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) 4px max(6px,env(safe-area-inset-left,0px));z-index:30;overflow-x:auto}

.sheethead{display:flex;align-items:center;gap:8px;padding:12px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}

.btn{padding:9px 14px;border-radius:10px;background:var(--accent);color:var(--ink);font-weight:600}

<div id="app" class="t-paper hand-right">
  <header class="top" id="top"></header>
  <main id="outline" aria-label="Outline"></main>
  <div id="backpill" hidden><button id="backbtn"></button></div>
  <button id="fab" aria-label="Capture a thought into the inbox">📥</button>
  <nav id="bar" aria-label="Main actions">
    <button id="b-more" aria-label="More"><span>⋯</span><small>More</small></button>
    <button id="b-undo" aria-label="Undo"><span>↩</span><small>Undo</small></button>
    <button id="b-search" aria-label="Search"><span>🔍</span><small>Search</small></button>
    <button id="b-add" aria-label="Add here"><span>＋</span><small>Add here</small></button>
  </nav>
  <div id="tools" hidden role="toolbar" aria-label="Editing">
    <button data-t="undo" aria-label="Undo typing">↩</button>
    <button data-t="redo" aria-label="Redo typing">↪</button>
    <button data-t="out" aria-label="Outdent">⇤</button>
    <button data-t="in" aria-label="Indent">⇥</button>
    <button data-t="up" aria-label="Move up">↑</button>
    <button data-t="down" aria-label="Move down">↓</button>

  <section id="detail" hidden aria-label="Item details"></section>
  <div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>
</div>

<script>
(()=>{
"use strict";
/* ---------- storage (browser only; prototype) ---------- */
const K={ev:"tt-proto-events-v2",dev:"tt-proto-device-v1",ui:"tt-proto-ui-v1"};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uuid=()=>{try{return crypto.randomUUID()}catch(e){return "x"+Math.random().toString(16).slice(2)+Date.now().toString(16)}};
let device=load(K.dev,null);
if(!device){device={id:uuid(),label:/iPad|Tablet/i.test(navigator.userAgent)?"Tablet":/Mobi|iPhone|Android/i.test(navigator.userAgent)?"Phone":"Desktop"};save(K.dev,device)}
let events=load(K.ev,[]);
const ui=Object.assign({focus:null,collapsed:[],hand:"right",recent:[],lastPlaced:null},load(K.ui,{}));
const saveUi=()=>save(K.ui,{focus:ui.focus,collapsed:ui.collapsed,hand:ui.hand,recent:ui.recent,lastPlaced:ui.lastPlaced});

/* ---------- events, hybrid logical clock ---------- */
let INBOX=null; /* the inbox is an ordinary item, marked by tree.inbox-set; always shown last at top level */
const isoLocal=d=>{const o=-d.getTimezoneOffset(),s=o>=0?"+":"-",p=n=>String(Math.floor(Math.abs(n))).padStart(2,"0");

/* ---------- projection ---------- */
let P=null;

  const isDesc=(id,anc)=>{let p=items.get(id);while(p){if(p.parent===anc)return true;p=items.get(p.parent)}return false};
  for(const e of [...evs].sort(order)){
    const d=e.data||{};if(d.reverts)reverted.add(d.reverts);

    switch(e.type){
      case"item.created":if(items.has(d.itemId))break;{const n={id:d.itemId,parent:null,title:d.title||"",note:d.note||"",deleted:false,tags:new Set(),created:e.clock.t,changed:e.clock.t};items.set(n.id,n);place(n,d.parentId??null,d.afterItemId)}break;
      case"item.title-changed":if(it){it.title=d.title;it.changed=e.clock.t}break;
      case"item.note-changed":if(it){it.note=d.note;it.changed=e.clock.t}break;

      case"display-name.set":if(tags.has(d.elementId))tags.get(d.elementId).name=d.text;break;
      case"item.tagged":if(it){it.tags.add(d.tagId);it.changed=e.clock.t}break;

}

    for(const p of path.slice(0,-1)){crumbs.append(el("span",{class:"sep",text:"›"}),el("button",{text:p.title||"Untitled",onclick:()=>setFocus(p.id)}))}

function matches(it){const q=norm(state.search||"").trim();const hit=!q||norm(it.title).includes(q)||norm(it.note).includes(q)||[...it.tags].some(t=>norm(tagName(t)).includes(q.replace(/^@@/,"")));

  if(i<0||n.length!==text.length){frag.append(text);return frag}
  frag.append(text.slice(0,i),el("mark",{text:text.slice(i,i+q.length)}),text.slice(i+q.length));return frag}

  app.className=app.className.replace(/\bt-\w+/g,"").trim()+" t-"+pageTheme;
  const filtering=state.search!==null&&(norm(state.search).trim()||state.recentOnly);
  let keep=null;
  if(filtering){keep=new Set();for(const it of P.items.values()){if(!it.deleted&&visibleItem(it.id)&&matches(it)){let x=it;while(x){keep.add(x.id);x=P.items.get(x.parent)}}}}
  const walk=(parent,depth)=>{
    const ks=kidsOf(parent);
    let draftDone=false;

    if(draftHere&&!state.draft.after){outline.append(draftRow(depth));draftDone=true}
    for(const id of ks){const it=P.items.get(id);if(keep&&!keep.has(id))continue;

      const open=filtering||!ui.collapsed.includes(id);

      if(draftHere&&!draftDone&&state.draft.after===id){outline.append(draftRow(depth));draftDone=true}}
    if(draftHere&&!draftDone)outline.append(draftRow(depth));

/* swipe left on a row opens the item (prototype gesture, UX topic 6) */

/* ---------- editing (drafts are local until editing ends) ---------- */
function editor(){
  const d=state.draft;const inp=el("input",{class:"editin",type:"text","aria-label":"Title",value:d.value||ZW,enterkeyhint:"next",autocomplete:"off"});
  inp.addEventListener("input",()=>{const raw=inp.value;
    if(raw===""){if(d.value===""){inp.value=ZW;backspaceEmpty();return}inp.value=ZW;d.value="";d.hist.push("");d.fut=[];return}
    const v=clean(raw);
    if(d.isNew&&v===" "){inp.value=ZW;d.value="";indentDraft();return}
    if(raw.startsWith(ZW)&&v){inp.value=v;inp.setSelectionRange(v.length,v.length)}
    d.value=v;d.hist.push(v);d.fut=[]});

    if(ev.key==="Enter"){ev.preventDefault();commitDraft(!(!d.isNew&&d.id===ui.focus))}

    else if(ev.key==="Tab"){ev.preventDefault();ev.shiftKey?outdentDraft():indentDraft()}
    else if(ev.key==="Backspace"&&clean(inp.value)===""){ev.preventDefault();backspaceEmpty()}});

  inp.addEventListener("blur",()=>{setTimeout(()=>{const a=document.activeElement;if(state.draft===d&&!tools.contains(a)&&!(a&&a.classList&&a.classList.contains("editin")))commitDraft(false)},150)});
  return inp}
function startNew(parent,after){commitDraft(false,true);state.draft={isNew:true,id:uuid(),parent,after,value:"",hist:[""],fut:[]};state.sel=null;showTools(true);renderOutline()}
function startEdit(id){commitDraft(false,true);const it=P.items.get(id);const tagStr=[...it.tags].map(t=>" @@"+tagName(t)).join("");
  state.draft={isNew:false,id,value:it.title,origTags:tagStr,hist:[it.title],fut:[]};showTools(true);renderAll()}

    if(parsed.title||parsed.note||parsed.tags.length){applyParsed(d.id,parsed,true,d.parent,d.after);state.sel=d.id;
      if(chain){state.draft={isNew:true,id:uuid(),parent:d.parent,after:d.id,value:"",hist:[""],fut:[]};state.sel=null}}
  }else{applyParsed(d.id,parsed,false);state.sel=d.id;
    if(chain){state.draft={isNew:true,id:uuid(),parent:P.items.get(d.id).parent,after:d.id,value:"",hist:[""],fut:[]};state.sel=null}}

  inp.addEventListener("beforeinput",ev=>{if(ev.inputType==="deleteContentBackward"&&clean(inp.value)===""){ev.preventDefault();unnest()}});
  inp.addEventListener("keydown",ev=>{
    if(ev.key==="Enter"){ev.preventDefault();const parsed=parseTitle(inp.value);if(!parsed.title&&!parsed.note){return}
      const id=uuid();applyParsed(id,parsed,true,parent,after);done.push(id);lastId=id;after=id;inp.value=ZW;capPrev="";render();renderOutline();announce("Captured")}
    else if(ev.key==="Backspace"&&clean(inp.value)===""){ev.preventDefault();unnest()}});
  render();
  openSheet("Capture","Into the inbox of “My thoughts”",[list,line,where,el("p",{class:"hint",text:"Enter starts the next thought. A space at the start of an empty line, or ⇥ above the keyboard, nests it under the line above; Backspace on an empty line, or ⇤, moves it back out. Use ## to add a note and @@ for tags."})],
    el("button",{class:"btn ghost",text:"Details",onclick:()=>{if(lastId){closeAll();openDetail(lastId)}else toast("Capture a thought first.")}}));
  sheet.className="sheet t-"+themeFor(INBOX);sheet.append(capTools);placeTools();
  setTimeout(()=>inp.focus(),60)}

/* ---------- detail page: note first ---------- */
let noteTimer=null;
function openDetail(id){commitDraft(false,true);closeAll();const it=P.items.get(id);if(!it)return;
  const th=themeFor(id);detail.className="t-"+th;
  const title=el("input",{class:"dtitle",value:it.title,"aria-label":"Title"});
  title.addEventListener("change",()=>{const p=parseTitle(title.value);applyParsed(id,p,false);openDetail(id)});
  const tagsBox=el("div",{class:"dtags"});
  for(const t of it.tags)tagsBox.append(el("button",{class:"tag",text:tagName(t),onclick:ev=>tagMenu(id,t,ev.currentTarget)}));
  tagsBox.append(el("button",{class:"btn ghost",style:"padding:3px 10px;font-size:13px",text:"＋ Tag",onclick:()=>tagPicker(id)}));
  const note=el("textarea",{"aria-label":"Note",placeholder:"Write the note…"});note.value=it.note;note.hidden=true;
  const view=el("div",{class:"mdview",tabindex:"0",role:"button","aria-label":"Note, tap to edit"});
  const flush=()=>{clearTimeout(noteTimer);const v=normText(note.value).replace(/\r\n/g,"\n");if(v!==P.items.get(id).note){write("item.note-changed",{itemId:id,note:v,format:"markdown"});refresh()}};
  const show=()=>{view.replaceChildren(note.value.trim()?mdBlocks(note.value):el("p",{class:"ph",text:"Write the note…"}))};show();
  const bar=el("div",{class:"notebar",role:"toolbar","aria-label":"Formatting"});bar.hidden=true;
  const wrap=(a,b,ph)=>{const s=note.selectionStart,e=note.selectionEnd,sel=note.value.slice(s,e)||ph;note.value=note.value.slice(0,s)+a+sel+b+note.value.slice(e);note.focus();note.setSelectionRange(s+a.length,s+a.length+sel.length);note.dispatchEvent(new Event("input"))};
  const linePrefix=p=>{const s=note.selectionStart;const ls=note.value.lastIndexOf("\n",s-1)+1;note.value=note.value.slice(0,ls)+p+note.value.slice(ls);note.focus();note.setSelectionRange(s+p.length,s+p.length);note.dispatchEvent(new Event("input"))};
  for(const[l,a,f]of[["B","Bold",()=>wrap("**","**","bold")],["I","Italic",()=>wrap("*","*","italic")],["H","Heading",()=>linePrefix("## ")],["•","List",()=>linePrefix("- ")],["🔗","Link",()=>wrap("[","](https://)","text")]])bar.append(el("button",{text:l,"aria-label":a,onclick:f}));
  bar.append(el("button",{class:"done",text:"✓","aria-label":"Done",onclick:()=>note.blur()}));
  bar.addEventListener("mousedown",e=>e.preventDefault());bar.addEventListener("pointerdown",e=>e.preventDefault());
  const edit=()=>{view.hidden=true;note.hidden=false;bar.hidden=false;placeTools();note.focus()};
  view.addEventListener("click",ev=>{if(ev.target.closest("a"))return;edit()});view.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();edit()}});
  note.addEventListener("input",()=>{clearTimeout(noteTimer);noteTimer=setTimeout(flush,1200)});
  note.addEventListener("blur",()=>{setTimeout(()=>{if(document.activeElement===note)return;flush();show();note.hidden=true;bar.hidden=true;view.hidden=false},100)});
  const hist=events.filter(e=>evItem(e)===id).length;
  const back=el("button",{"aria-label":"Back","text":"←",onclick:()=>{flush();if(location.hash==="#open"){history.back()}else{closeDetail()}}});
  detail.replaceChildren(el("div",{class:"dhead"},back,el("div",{class:"dpath",text:pathText(id)})),
    el("div",{class:"dbody"},title,tagsBox,view,note),bar,
    el("div",{class:"strip"},el("button",{text:"🕘 "+hist,"aria-label":"History, "+hist+" changes",onclick:()=>{flush();historySheet(id)}}),
      el("button",{class:"dmore",text:"⋯","aria-label":"Item actions",onclick:ev=>{flush();itemMenu(id,ev.currentTarget,true)}})));
  if(location.hash!=="#open"){try{location.hash="open"}catch(e){}}
  detail.hidden=false;$("#bar").style.visibility="hidden";$("#fab").style.bottom="calc(64px + env(safe-area-inset-bottom,0px))";
  if(!it.note)setTimeout(edit,80)}

/* safe Markdown rendering: DOM nodes only, never HTML; links only https, http, mailto, item */
function mdInline(text){const frag=document.createDocumentFragment();const re=/(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*\s][^*]*\*|_[^_\s][^_]*_)|(\[[^\]]*\]\([^)\s]*\))/g;let last=0,m;
  while((m=re.exec(text))){frag.append(text.slice(last,m.index));const s=m[0];
    if(m[1])frag.append(el("code",{text:s.slice(1,-1)}));
    else if(m[2])frag.append(el("strong",null,mdInline(s.slice(2,-2))));
    else if(m[3])frag.append(el("em",null,mdInline(s.slice(1,-1))));
    else{const lm=s.match(/^\[([^\]]*)\]\(([^)\s]*)\)$/);const label=lm[1],href=lm[2];
      if(/^item:/i.test(href)){const tid=href.slice(5);const t=P.items.get(tid);frag.append(el("a",{href:"#",text:label||(t?t.title:"not found"),onclick:ev=>{ev.preventDefault();ev.stopPropagation();if(t){closeDetail();goTo(tid)}}}))}
      else if(/^(https?:|mailto:)/i.test(href))frag.append(el("a",{href,target:"_blank",rel:"noopener noreferrer",text:label||href}));
      else frag.append(s)}
    last=m.index+s.length}frag.append(text.slice(last));return frag}
function mdBlocks(text){const frag=document.createDocumentFragment();let list=null,para=null;
  const endPara=()=>{para=null},endList=()=>{list=null};
  for(const line of text.split("\n")){
    let m;
    if(!line.trim()){endPara();endList();continue}
    if((m=line.match(/^(#{1,3})\s+(.*)$/))){endPara();endList();frag.append(el("h"+(m[1].length+2),null,mdInline(m[2])));continue}
    if((m=line.match(/^\s*[-*]\s+(.*)$/))){endPara();if(!list||list.tagName!=="UL"){list=el("ul");frag.append(list)}list.append(el("li",null,mdInline(m[1])));continue}
    if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){endPara();if(!list||list.tagName!=="OL"){list=el("ol");frag.append(list)}list.append(el("li",null,mdInline(m[1])));continue}
    endList();if(!para){para=el("p");frag.append(para)}else para.append(el("br"));para.append(mdInline(line))}
  return frag}
const mdStrip=s=>(s||"").replace(/^#{1,3}\s+/,"").replace(/^\s*[-*]\s+/,"").replace(/\*\*([^*]+)\*\*/g,"$1").replace(/[*_`]/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1");
window.addEventListener("hashchange",()=>{if(location.hash!=="#open"&&!detail.hidden){const n=detail.querySelector("textarea");if(n)n.blur();closeAll();closeDetail();return}
  /* the device's back steps out of focus one level at a time */
  if(location.hash===""&&ui.focus&&detail.hidden){goBack();markFocusHistory()}});
function closeDetail(){if(location.hash==="#open"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}detail.hidden=true;$("#bar").style.visibility="";$("#fab").style.bottom="";renderAll()}
function tagMenu(id,t,anchor){openPop(anchor,[{label:"Remove from this item",run:()=>{write("item.untagged",{itemId:id,tagId:t});refresh();openDetail(id)}},
  {label:"Show all with “"+tagName(t)+"”",run:()=>{closeDetail();state.search="@@"+tagName(t);renderAll()}},
  {label:"Rename “"+tagName(t)+"” everywhere…",run:()=>renameTag(id,t)}])}
function renameTag(id,t){const inp=el("input",{class:"field",value:tagName(t),"aria-label":"New name"});
  openSheet("Rename tag","Changes the name on every item",[inp,el("div",{style:"display:flex;gap:8px;margin-top:12px"},el("button",{class:"btn",text:"Rename",onclick:()=>{const v=inp.value.trim();if(v){write("display-name.set",{elementId:t,field:"name",language:"en",text:v});refresh()}closeAll();openDetail(id)}}))])}

/* ---------- more: exchange, hand, event log, about ---------- */
function moreSheet(){
  const handBtn=el("button",{class:"opt",onclick:()=>{ui.hand=ui.hand==="right"?"left":"right";saveUi();applyHand();moreSheet()}},el("span",null,"Hand: "+(ui.hand==="right"?"right":"left"),el("span",{class:"path",text:"Mirrors the capture button and the bar"})));
  openSheet("More",null,[
    el("div",{style:"display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)"},
      el("button",{class:"btn ghost",style:"flex:1",text:"▸ Collapse all",onclick:()=>{setCollapsedAll(true);closeAll();renderAll();toast("Everything collapsed")}}),
      el("button",{class:"btn ghost",style:"flex:1",text:"▾ Expand all",onclick:()=>{setCollapsedAll(false);closeAll();renderAll();toast("Everything expanded")}})),
    el("button",{class:"opt",onclick:()=>{closeAll();itemMenu(INBOX,$("#b-more"))}},el("span",null,"📥 Inbox",el("span",{class:"path",text:"Open, focus, tags, theme, history"}))),
    el("button",{class:"opt",onclick:exchangeSheet},el("span",null,"Exchange with another device",el("span",{class:"path",text:"Sync by file, as in release 1"}))),
    handBtn,
    el("button",{class:"opt",onclick:logSheet},el("span",null,"Event log",el("span",{class:"path",text:events.length+" events in this browser"}))),
    el("button",{class:"opt",onclick:aboutSheet},el("span",null,"About this prototype")),
    el("button",{class:"opt",onclick:resetSheet},el("span",null,"Reset prototype…",el("span",{class:"path",text:"Start again with the tutorial tree"})))])}
function resetSheet(){openSheet("Reset prototype","Deletes everything in this browser",[
  el("p",{class:"hint",text:"All "+events.length+" events on this device are deleted, including everything you entered, and the tutorial tree is created again. Export first if you want to keep anything."}),
  el("div",{style:"display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"},
    el("button",{class:"btn danger",text:"Delete everything and reset",onclick:()=>{events=[];save(K.ev,events);ui.focus=null;ui.collapsed=[];ui.recent=[];saveUi();seed();refresh();closeAll();state.sel=null;renderAll();toast("Reset to the tutorial")}}),
    el("button",{class:"btn ghost",text:"Cancel",onclick:moreSheet}))])}
/* collapse or expand every branch in the current view (the whole tree, or the focused branch) */
function setCollapsedAll(on){const all=[];const walk=p=>{for(const k of kidsOf(p)){if(kidsOf(k).length){all.push(k);walk(k)}}};walk(ui.focus);
  if(on){ui.collapsed=[...new Set([...ui.collapsed,...all])]}else{ui.collapsed=ui.collapsed.filter(c=>!all.includes(c))}saveUi()}
function applyHand(){app.classList.toggle("hand-left",ui.hand==="left");app.classList.toggle("hand-right",ui.hand!=="left")}
function treeIdOf(evs){const m=evs.filter(e=>e&&e.type==="tree.inbox-set"&&e.clock).sort(order)[0];return m?m.data.itemId:null}
function exportText(){return JSON.stringify({format:"thoughttree-prototype-export",version:2,from:device.label,treeId:treeIdOf(events),events})}
function exchangeSheet(){
  const status=el("div",{class:"hint",text:""});const area=el("textarea",{class:"field",rows:"4",placeholder:"Paste the text exported on the other device","aria-label":"Paste export"});
  const file=el("input",{type:"file",accept:".json,.txt,application/json,text/plain","aria-label":"Choose an export file"});
  const valid=list=>list.filter(e=>e&&e.id&&e.clock&&e.type&&e.data);
  const merge=(data)=>{const byId=new Map(events.map(e=>[e.id,JSON.stringify(e)]));let added=0,same=0,rejected=0;const changed=new Set();
    for(const e of valid(data.events)){const s=JSON.stringify(e);if(byId.has(e.id)){byId.get(e.id)===s?same++:rejected++;continue}events.push(e);byId.set(e.id,s);added++;const i=evItem(e);if(i)changed.add(i)}
    save(K.ev,events);refresh();renderAll();
    const from=data.from||"the other device";
    status.replaceChildren(`${added} new events from ${from} (${changed.size} items new or changed). ${same} already known.`+(rejected?` ${rejected} rejected: same id, different content.`:""));
    if(added){const first=[...changed].find(i=>P.items.has(i)&&visibleItem(i)&&i!==INBOX);
      toast(`${changed.size} new or changed items from ${from}`,[...(first?[["Show",()=>goTo(first)]]:[]),["Send back",()=>exchangeSheet()]])}
    else toast(`Nothing new from ${from}: both devices already have the same events.`)};
  const replace=(data)=>{events=valid(data.events);save(K.ev,events);ui.focus=null;ui.collapsed=[];ui.recent=[];saveUi();refresh();closeAll();state.sel=null;renderAll();
    toast(`The old tree is deleted. This device now has the tree from ${data.from||"the other device"}; exchanges keep both in step from now on.`)};
  const doImport=txt=>{let data;try{data=JSON.parse(txt)}catch(e){status.replaceChildren("That is not a ThoughtTree export. Was the whole text pasted?");return}
    if(!data||data.format!=="thoughttree-prototype-export"||!Array.isArray(data.events)){status.replaceChildren("That is not a ThoughtTree export.");return}
    const theirs=data.treeId||treeIdOf(data.events),mine=treeIdOf(events);
    if(theirs&&mine&&theirs!==mine){
      const ownChanges=events.filter(e=>e.device===device.id).length;
      status.replaceChildren(el("p",{style:"margin:0 0 8px;color:var(--text)",text:`This is a different tree than the one on this device (each device started its own tutorial). What should happen?`}),
        el("div",{style:"display:flex;flex-direction:column;gap:8px"},
          el("button",{class:"btn",text:`Delete this device's tree and use the one from ${data.from||"the other device"}`,onclick:ev=>{if(!ownChanges){replace(data);return}
            ev.currentTarget.replaceWith(el("div",{style:"display:flex;flex-direction:column;gap:6px"},el("span",{style:"color:var(--text)",text:`This deletes the tree on this device, with your ${ownChanges} changes made here. Export it first if you want to keep anything.`}),
              el("button",{class:"btn danger",text:"Delete it and use the other tree",onclick:()=>replace(data)})))}}),
          el("span",{class:"hint",style:"margin:0",text:ownChanges?`Replaces this device's tree, including your ${ownChanges} changes made here. Like pairing a new device.`:"Replaces this device's tutorial, which has no changes of yours. Like pairing a new device."}),
          el("button",{class:"btn ghost",text:"Merge both trees",onclick:()=>merge(data)}),
          el("span",{class:"hint",style:"margin:0",text:"Keeps everything; items of both trees appear side by side, and one of the two inboxes becomes an ordinary item."})));
      status.scrollIntoView({block:"nearest"});return}
    merge(data);status.scrollIntoView({block:"nearest"})};
  file.addEventListener("change",()=>{const f=file.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(f)});
  const exportBtn=el("button",{class:"btn",text:"Copy this device's events",onclick:async()=>{const t=exportText();try{await navigator.clipboard.writeText(t);status.textContent=`Copied ${events.length} events. Paste them on the other device, for example through a note or a message to yourself.`}catch(e){area.value=t;area.focus();area.select();status.textContent="Copying was refused here. The text is selected below: copy it by hand."}}});
  openSheet("Exchange with another device","Both devices end up with all events",[
    el("div",{class:"lbl",text:"1 · Send"}),exportBtn,
    el("div",{class:"lbl",text:"2 · Receive"}),area,el("div",{style:"display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"},el("button",{class:"btn ghost",text:"Import pasted text",onclick:()=>doImport(area.value)}),file),
    status,el("p",{class:"hint",text:"Events with an id you already have are skipped. Afterwards, send your own events back so both devices are equal. In the real app this is an encrypted file; here it is plain text, so do not use private notes."})])}
function logSheet(){const list=[...events].sort(order).reverse().slice(0,200);
  const reset=el("button",{class:"btn danger",text:"Reset prototype…",onclick:()=>{reset.replaceWith(el("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap"},el("span",{class:"hint",text:"Delete all events in this browser?"}),
    el("button",{class:"btn danger",text:"Delete everything",onclick:()=>{events=[];save(K.ev,events);ui.focus=null;ui.collapsed=[];ui.recent=[];saveUi();seed();refresh();closeAll();renderAll();toast("Reset to the tutorial")}})))}});
  openSheet("Event log",events.length+" events, newest first",[...list.map(e=>el("div",{class:"ev"+(P.reverted.has(e.id)?" rev":"")},el("div",null,el("code",{text:e.type}),el("span",{class:"what",text:"  "+describe(e)})),el("div",{class:"meta",text:when(e)+" · "+who(e)+" · clock "+e.clock.t+"."+e.clock.c}))),el("div",{style:"margin-top:14px"},reset)])}
function aboutSheet(){const p=t=>el("p",{class:"hint",text:t});
  openSheet("About this prototype","A clickable sketch, not the app",[
    p("The tree you start with is a small tutorial; More › Event log › Reset brings it back. This page lets you try the UX decisions of ThoughtTree on your phone: capturing into the inbox, sorting with Move to…, the item menu, Focus, the detail page, tags with @@, notes with ##, themes per branch, quick undo and the history."),
    p("Every change is written as an event (item.created, item.moved, theme.set, …) with a hybrid logical clock, and the outline is computed from the event log, as in the architecture. The log lives only in this browser; clearing site data deletes it."),
    p("Not real: no encryption, no Blazor, no installation as an app, no relations or views yet, no drag and drop. The inbox is an ordinary item marked as the inbox, always last at the top level, as proposed for the architecture."),
    p("This device: "+device.label+" · "+device.id.slice(0,8))])}

/* ---------- wiring ---------- */
$("#fab").addEventListener("click",capture);
$("#b-add").addEventListener("click",()=>{const sel=state.sel?P.items.get(state.sel):null;
  if(sel&&sel.id===INBOX){ui.collapsed=ui.collapsed.filter(c=>c!==INBOX);startNew(INBOX,lastChild(INBOX))}else if(sel){startNew(sel.parent,sel.id)}else{const p=ui.focus;startNew(p,lastChild(p))}});
$("#b-search").addEventListener("click",()=>{state.search=state.search===null?"":null;state.recentOnly=false;renderAll()});
$("#b-undo").addEventListener("click",()=>{commitDraft(false,true);quickUndo()});
$("#b-more").addEventListener("click",moreSheet);
document.addEventListener("keydown",ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key==="z"&&!ev.target.closest("input,textarea")){ev.preventDefault();quickUndo()}
  if(ev.key==="Escape"&&(!sheet.hidden||!pop.hidden)){state.previewTheme=null;closeAll();renderAll()}});
function renderAll(){renderTop();renderOutline()}
applyHand();
if(ui.focus&&ui.focus!==INBOX&&!(P.items.get(ui.focus)&&visibleItem(ui.focus)))ui.focus=null;
renderAll();
})();
</script>
