<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Spike 1 durability</title></head>
<body><pre id="out">starting</pre>
<script type="module">
// Q3 writer (plan section 3): on start it opens the store and reports what it finds (the recovery check after the
// previous kill), then writes in a loop and reports every acknowledged write (transaction 'complete') to the test
// server before the next write. The supervisor (harness/kill.mjs) kills the browser at random moments.
import { IdbStore } from './storage.js';
const q = new URLSearchParams(location.search);
const run = Number(q.get('run')), durability = q.get('durability') || 'default', workload = q.get('workload') || 'mixed';
const db = 'tt-durability-' + (q.get('variant') || 'x');
let state = BigInt(q.get('seed') || '1') * 1000003n + BigInt(run);
const rnd = () => { state = (state + 0x9E3779B97F4A7C15n) & 0xffffffffffffffffn; let z = state; z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & 0xffffffffffffffffn; z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & 0xffffffffffffffffn; return Number((z ^ (z >> 31n)) >> 11n) / 2 ** 53; };
const post = (body) => fetch('/q3', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ run, ...body }) });
const out = document.getElementById('out');
const sum = (u8) => { let s = 0; for (let i = 0; i < u8.length; i += 997) s = (s * 31 + u8[i]) >>> 0; return s; };

let store;
const t0 = performance.now();
try {
  store = await IdbStore.open(db, durability);
} catch (e) { await post({ type: 'verify', openOk: false, error: String(e) }); throw e; }
const openMs = performance.now() - t0;
// Recovery check: which batches are there, are any half visible, is the snapshot readable.
const found = {}; const partial = [];
const counts = new Map();
let total = 0;
for (let after = 0; ;) {
  const recs = await store.readAfter(after, 50000);
  if (!recs.length) break;
  for (const r of recs) { const k = r.batchId; const c = counts.get(k); if (c) c.n++; else counts.set(k, { n: 1, size: r.batchSize, run: r.run, no: r.batchNo }); }
  total += recs.length; after = recs[recs.length - 1].seq;
}
for (const [k, c] of counts) { if (c.n !== c.size) partial.push(k); (found[c.run] ??= []).push(c.no); }
let snapshot = null, draft = null, snapshotCorrupt = false;
try { const s = await store.getSnapshot(); if (s) { snapshot = s.version; snapshotCorrupt = sum(s.bytes) !== s.sum || s.bytes.length !== s.size; } } catch (e) { snapshotCorrupt = true; }
try { const d = await store.getDraft('draft'); if (d) draft = d.version; } catch { }
await post({ type: 'verify', openOk: true, openMs, recoveryMs: performance.now() - t0, events: total, batches: counts.size, partial, found, snapshot, snapshotCorrupt, draft });

// Write loop.
let batchNo = 0, snapVersion = Number(q.get('snapBase') || 0) + run * 1000, draftVersion = run * 1000000;
for (;;) {
  const r = rnd();
  const kind = workload === 'mixed' ? (r < 0.70 ? 'events' : r < 0.85 ? 'snapshot' : 'draft') : workload;
  if (kind === 'events') {
    const size = [1, 10, 100][Math.floor(rnd() * 3)];
    const no = batchNo++;
    const batchId = `r${run}-b${no}`;
    const records = [];
    for (let i = 0; i < size; i++) {
      const payload = new Uint8Array(64); crypto.getRandomValues(payload);
      records.push({ v: 1, eventId: `${batchId}-e${i}`, keyId: 'k', nonce: payload.slice(0, 12), payload, batchId, batchSize: size, run, batchNo: no });
    }
    await store.appendBatch(records);
    await post({ type: 'ack', kind, batchNo: no, size });
  } else if (kind === 'snapshot') {
    const size = (1 + Math.floor(rnd() * 4)) * 1024 * 1024;
    const bytes = new Uint8Array(size); for (let i = 0; i < size; i += 65536) crypto.getRandomValues(bytes.subarray(i, Math.min(size, i + 65536)));
    const version = ++snapVersion;
    await store.putSnapshot({ version, size, sum: sum(bytes), bytes });
    await post({ type: 'ack', kind, version });
  } else {
    const version = ++draftVersion;
    await store.putDraft('draft', { version, text: 'Entwurf Grüße 🌳 '.repeat(1 + Math.floor(rnd() * 50)) });
    await post({ type: 'ack', kind, version });
  }
  out.textContent = `run ${run} batch ${batchNo}`;
}
</script></body></html>
