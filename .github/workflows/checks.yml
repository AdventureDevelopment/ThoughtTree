# Reusable: the checks of the branch check (docs/architecture.md section 8, loops).
# Called by branch-check.yml on every push to a branch, by push-gate.yml on pull requests, and by
# deploy-test.yml and deploy-production.yml before they deploy.
# No secrets, no Azure, no network beyond package restore (ADR-035).
name: checks

on:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-and-test:
    name: Build, analyzers, architecture rules and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked mode, exact dependency graph)
        run: dotnet restore ThoughtTree.slnx --locked-mode

      - name: Build with warnings as errors, analyzers and banned APIs (ADR-027, ADR-034, ADR-039)
        run: dotnet build ThoughtTree.slnx --no-restore --configuration Release -warnaserror

      - name: Check formatting
        run: dotnet format ThoughtTree.slnx --verify-no-changes --no-restore

      - name: "Tests: Specify"
        run: dotnet test ThoughtTree.slnx --no-build --configuration Release --filter "Intent=Specify" --logger "trx;LogFilePrefix=specify" --results-directory TestResults

      - name: "Tests: Secure (architecture, banned APIs, harness rules, static verify lines)"
        run: dotnet test ThoughtTree.slnx --no-build --configuration Release --filter "Intent=Secure" --logger "trx;LogFilePrefix=secure" --results-directory TestResults

      - name: "Tests: Confirm (none that run without a browser yet)"
        run: dotnet test ThoughtTree.slnx --no-build --configuration Release --filter "Intent=Confirm" --results-directory TestResults

      - name: Report verify filters without tests
        if: always()
        run: |
          report=tests/secure/ThoughtTree.Architecture.Rules/bin/Release/net10.0/verify-report.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Not yet in place in the branch check
        run: |
          {
            echo "## Not yet in place (branch check)"
            echo "- UI specifications in headless Chromium: no UI specifications yet (client shell, foundation step 4)."
            echo "- Licence check over the resolved dependency graph (ADR-050): not implemented yet; versions and licences were checked by hand (see the commit that added Directory.Packages.props)."
            echo "- Zero-match rule for dotnet test filters (docs/adr/README.md): reported above, not enforced while the code the ADRs verify does not exist."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep test results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 7
